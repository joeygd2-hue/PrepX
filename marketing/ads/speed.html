<!doctype html>
<html><head><meta charset="utf-8"><link rel="stylesheet" href="common.css">
<style>
.big{position:absolute;left:0;right:0;text-align:center;font-weight:600;letter-spacing:-.055em;line-height:1}
.qhead{position:absolute;left:30px;right:30px;top:150px;text-align:center;font-size:46px;font-weight:600;letter-spacing:-.05em}
.timer{height:6px;border-radius:9px;background:var(--subtle2);overflow:hidden;margin-top:14px}
.stem{font-size:22px;font-weight:600;letter-spacing:-.035em;line-height:1.25;margin-top:16px}
.why{margin-top:14px;display:flex;align-items:center;gap:8px;font-size:14px}
.cnt{position:absolute;left:0;right:0;top:330px;text-align:center;font-size:220px;font-weight:600;letter-spacing:-.07em;line-height:1}
</style></head>
<body>
<script src="common.js"></script>
<script>
const B=[0.49,0.93,1.37,1.83,2.28,2.74,3.2,3.69,4.13,4.57,5.02,5.46,5.92,6.36,6.8,7.24,7.69,8.13,8.57,9.03,9.5,9.96,10.43,10.89,11.28,11.73,12.19,12.65,13.12,13.58,14.05,14.51,14.98,15.44,15.91,16.37,16.83,17.3,17.76,18.23,18.69];
const DROP=8.57, H=18.23, END=19.7;
const QS=[
 {org:'DECA',c:'#5b9bff',ink:'#0b1220',g:'#2f6fd6',stem:'Which of these is a fixed cost?',ch:['Raw materials','Sales commissions','Monthly rent','Shipping'],a:2,why:'Rent stays the same no matter how much you sell.',tin:8.57,trev:10.43,tout:11.28},
 {org:'HOSA',c:'#f0668f',ink:'#1a0710',g:'#c23b6a',stem:'What does the suffix -itis mean?',ch:['Pain','Inflammation','Removal','Tumor'],a:1,why:'Like tonsillitis: inflamed tonsils.',tin:11.28,trev:13.12,tout:14.05},
 {org:'TSA',c:'#ff5c70',ink:'#1a0509',g:'#e0303f',stem:"Ohm's law: voltage = current × ?",ch:['Power','Resistance','Frequency','Charge'],a:1,why:'V = I × R.',tin:14.05,trev:15.91,tout:16.83},
];
document.body.insertAdjacentHTML('afterbegin',frameHTML(`
<div class="scene" id="intro">
  <div class="big" style="top:330px;font-size:104px"><span class="w" id="i0">Speed</span></div>
  <div class="big serif" style="top:430px;font-size:128px;color:var(--accent);letter-spacing:-.02em"><span class="w" id="i1">round.</span></div>
  <div style="position:absolute;left:0;right:0;top:600px;display:flex;justify-content:center;gap:10px">
    <span class="chip" id="i2"><span class="dot" style="background:var(--deca)"></span><span class="dot" style="background:var(--hosa)"></span><span class="dot" style="background:var(--tsa)"></span>3 orgs</span>
    <span class="chip" id="i3">3 questions</span><span class="chip" id="i4">2 sec each</span></div>
</div>
<div class="scene" id="rules">
  <div class="big" style="top:360px;font-size:64px"><span class="w">Beat</span><span class="w">the</span><span class="w serif" style="color:var(--accent);font-size:1.2em">bar.</span></div>
  <div style="position:absolute;left:110px;right:110px;top:470px;height:10px;border-radius:9px;background:var(--subtle2);overflow:hidden"><div id="rbar" style="height:100%;background:var(--accent);border-radius:9px"></div></div>
  <div id="rsub" style="position:absolute;left:0;right:0;top:520px;text-align:center;font-size:20px;color:var(--muted);letter-spacing:-.02em">Keep score. Comment it below.</div>
</div>
<div class="scene" id="count"><div class="cnt num" id="cn">3</div></div>
${QS.map((q,k)=>`<div class="scene" id="q${k}">
  <div class="qhead" id="qh${k}"><span class="w">Q${k+1}</span><span class="w" style="color:var(--muted)">·</span><span class="w serif" style="color:${q.c};font-size:1.2em">${q.org}</span></div>
  <div class="card" id="qc${k}" style="top:280px">
    <div style="display:flex;justify-content:space-between;align-items:center"><span class="eyebrow">Speed round · ${k+1} / 3</span><span class="eyebrow num" id="qs${k}" style="color:${q.c}">2.0s</span></div>
    <div class="timer"><div id="qt${k}" style="height:100%;width:100%;background:${q.c};border-radius:9px"></div></div>
    <div class="stem">${q.stem}</div>
    <div>${q.ch.map((c,i)=>`<div class="opt" id="o${k}_${i}"><span class="letter" id="l${k}_${i}">${'ABCD'[i]}</span><span>${c}</span>${i===q.a?`<svg width="20" height="20" viewBox="0 0 20 20" style="margin-left:auto"><path id="tk${k}" d="M4 10.5 L8.5 15 L16 6" fill="none" stroke="${q.ink}" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" pathLength="1" stroke-dasharray="1" stroke-dashoffset="1"/></svg>`:''}</div>`).join('')}</div>
    <div class="why" id="qw${k}" style="color:${q.c}"><span class="dot" style="background:${q.c}"></span>${q.why}</div>
  </div>
</div>`).join('')}
<div class="scene" id="duel">
  <div class="head" id="dh"><span class="w">3/3?</span><br><span class="w serif" style="color:var(--accent)">Duel</span><span class="w serif" style="color:var(--accent)">a</span><span class="w serif" style="color:var(--accent)">friend.</span></div>
  <div class="card" id="dc" style="top:330px">
    <div class="eyebrow">Head-to-head duel · DECA</div>
    <div style="display:flex;align-items:center;justify-content:space-between;margin-top:22px">
      <div style="text-align:center;width:150px"><div style="width:64px;height:64px;border-radius:50%;margin:0 auto;background:var(--accent);color:#0c0c0d;display:grid;place-items:center;font-weight:600;font-size:22px">Y</div><div style="margin-top:10px;font-weight:600">You</div><div class="mono num" id="ds0" style="font-size:30px;margin-top:4px;letter-spacing:-.04em">0</div></div>
      <div class="serif" id="vs" style="font-size:54px;color:var(--muted)">vs</div>
      <div style="text-align:center;width:150px"><div style="width:64px;height:64px;border-radius:50%;margin:0 auto;background:var(--subtle2);color:var(--muted);display:grid;place-items:center;font-weight:600;font-size:22px">M</div><div style="margin-top:10px;font-weight:600">Maya R.</div><div class="mono num" id="ds1" style="font-size:30px;margin-top:4px;letter-spacing:-.04em;color:var(--muted)">0</div></div>
    </div>
    <div style="margin-top:22px;text-align:center;font-size:14px;color:var(--muted)">Same questions. Same clock.</div>
    <div style="margin-top:14px;height:50px;border-radius:16px;background:var(--accent);color:#0c0c0d;display:grid;place-items:center;font-weight:600;font-size:16px">Send challenge</div>
  </div>
</div>
<div class="scene" id="end">${LOGO_HTML}</div>`));

window.render=function(t){
  stagePulse(B,t,H+.01,null);
  hideGlows();const G=['g0','g1','g2','g3'].map($);const l=lastBeat(B,t);
  // intro
  if(show('intro',t<4.13)){glow(G[0],270,470,230,'#c6f03a',.16*eo(p(t,0.3,.6))*(1-eio(p(t,3.9,.23))));
    const s0=io(t,B[0],4.13,.4,.24);s0.s=lerp(.8,1,back(p(t,B[0],.45)));put($('i0'),s0);
    const s1=io(t,B[1],4.13,.4,.24);s1.s=lerp(.7,1,back(p(t,B[1],.5)));put($('i1'),s1);
    [['i2',B[4]],['i3',B[5]],['i4',B[6]]].forEach(([id,a])=>{const s=io(t,a,4.13,.32,.24,18,30);s.s=lerp(.85,1,back(p(t,a,.35)));put($(id),s);});}
  // rules
  if(show('rules',t>=4.13&&t<6.8)){glow(G[0],270,470,220,'#c6f03a',.12);
    words($('rules'),t,B[9],6.8,.12);const r=eio(p(t,5.0,1.6));$('rbar').style.width=((1-r)*100).toFixed(1)+'%';
    $('rbar').parentElement.style.opacity=eo(p(t,B[9]+.2,.3))*(1-eio(p(t,6.55,.25)));put($('rsub'),io(t,B[11],6.8,.35,.25,14,20));}
  // countdown 3 2 1 Go
  if(show('count',t>=6.8&&t<DROP)){const marks=[[6.8,'3','#f2f2ec'],[7.24,'2','#f2f2ec'],[7.69,'1','#f2f2ec'],[8.13,'Go.','#c6f03a']];
    let cur=marks[0];for(const m of marks)if(t>=m[0])cur=m;const k=p(t,cur[0],.32);const cn=$('cn');cn.textContent=cur[1];cn.style.color=cur[2];
    cn.className=cur[1]==='Go.'?'cnt serif':'cnt num';cn.style.fontSize=cur[1]==='Go.'?'200px':'220px';
    const o=1-eio(p(t,DROP-.12,.12));cn.style.opacity=(eo(k)*o).toFixed(3);cn.style.transform=`scale(${lerp(1.5,1,eo5(k)).toFixed(3)})`;cn.style.filter=k<1?`blur(${((1-eo(k))*12).toFixed(1)}px)`:'none';
    glow(G[0],270,440,180+40*Math.exp(-(t-cur[0])*5),cur[1]==='Go.'?'#c6f03a':'#ffffff',(cur[1]==='Go.'?.3:.08)+.1*Math.exp(-(t-cur[0])*5));}
  flash(t,DROP,.75);
  // questions
  QS.forEach((q,k)=>{if(!show('q'+k,t>=q.tin&&t<q.tout))return;
    glow(G[0],270+Math.sin(t*1.3)*14,330,230,q.g,.32*eo(p(t,q.tin,.35))*(1-eio(p(t,q.tout-.22,.22))));
    words($('qh'+k),t,q.tin,q.tout,.05);const cs=io(t,q.tin+.04,q.tout,.36,.22,60,46);put($('qc'+k),cs);
    const tl=cl((q.trev-t)/(q.trev-q.tin-.12));const tt=$('qt'+k);tt.style.width=(tl*100).toFixed(1)+'%';$('qs'+k).textContent=(tl*2).toFixed(1)+'s';
    const rev=t>=q.trev,rp=eo(p(t,q.trev,.28));
    q.ch.forEach((c,i)=>{const o=$(`o${k}_${i}`),L=$(`l${k}_${i}`);const e=eo(p(t,q.tin+.12+i*.06,.3));
      if(i===q.a){o.style.background=rev?q.c:'var(--subtle)';o.style.borderColor=rev?'transparent':'var(--border)';o.style.color=rev?q.ink:'';o.style.fontWeight=rev?600:400;L.style.background=rev?'rgba(0,0,0,.18)':'var(--subtle2)';L.style.color=rev?q.ink:'var(--muted)';
        o.style.transform=`translateY(${((1-e)*12).toFixed(1)}px) scale(${(1+.05*Math.sin(Math.PI*rp)).toFixed(4)})`;o.style.opacity=e;o.style.boxShadow=rev?`0 14px 40px -12px ${q.c}`:'none';}
      else{o.style.opacity=(e*(1-.62*rp)).toFixed(3);o.style.transform=`translateY(${((1-e)*12).toFixed(1)}px) translateX(${(rev?Math.sin((t-q.trev)*40)*3*Math.exp(-(t-q.trev)*8):0).toFixed(2)}px)`;}});
    $('tk'+k).style.strokeDashoffset=1-eo(p(t,q.trev+.05,.25));
    const w=eo(p(t,q.trev+.12,.3));$('qw'+k).style.opacity=w;$('qw'+k).style.transform=`translateY(${(1-w)*8}px)`;});
  // duel
  if(show('duel',t>=16.83&&t<H)){glow(G[0],270,430,230,'#c6f03a',.16*eo(p(t,16.83,.4))*(1-eio(p(t,H-.22,.22))));
    words($('dh'),t,16.83,H,.07);put($('dc'),io(t,16.9,H,.4,.22,60,46));
    const n=eo(p(t,17.25,.7));$('ds0').textContent=Math.round(3*n)+'/3';$('ds1').textContent=Math.round(2*n)+'/3';
    const v=back(p(t,17.3,.35));$('vs').style.transform=`scale(${lerp(.4,1,v).toFixed(3)})`;$('vs').style.color=t>17.3?'#c6f03a':'';}
  // end
  if(show('end',t>=H)){const k=Math.exp(-(t-H)*2.2);glow(G[0],270,430,240,'#c6f03a',.12+.25*k);glow(G[1],270,430,120,'#ffffff',.05+.18*k);renderLogo(t,H,END);}
  flash(t,t>=H?H:DROP,.75);
};
window.DURATION=END;
window.render(0);
</script>
</body></html>
